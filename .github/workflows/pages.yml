# Publishes the demo to GitHub Pages. The Google Maps key is not in the repository:
# it comes from the MAPS_API_KEY secret and is written to config.local.js at deploy time.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write config.local.js from secret
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::MAPS_API_KEY secret is not set; the demo will use the schematic map."
            exit 0
          fi
          printf "window.BV_CONFIG.apiKey = '%s';\n" "$MAPS_API_KEY" > config.local.js

      - name: Prepare site
        run: |
          mkdir _site
          cp -R index.html config.js src assets .nojekyll _site/
          [ -f config.local.js ] && cp config.local.js _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
