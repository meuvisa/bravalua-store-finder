<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9DC09">
<title>Bravalua Store Finder</title>
<link rel="icon" href="assets/logo-bravalua.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Poppins:wght@400&display=swap">
<link rel="stylesheet" href="src/bv-store-finder.css?v=202610152002">
<style>
  /* Demo page chrome only (on bravalua.de the theme provides header and footer). */
  html, body { margin: 0; background: #fff; }
  .demo-head { border-bottom: 1px solid #F0E3CC; background: #fff; }
  .demo-head-in { max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .demo-head img { height: 56px; width: auto; display: block; }
  .demo-nav { display: flex; align-items: center; gap: 12px; }
  .demo-site { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 2px solid #43291A; border-radius: 8px;
    font: 700 14px/1 'Josefin Sans', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #43291A; text-decoration: none; padding-top: 2px; }
  .demo-site:hover { background: #FFFBD6; }
  .demo-foot { background: #fff; font-family: 'Poppins', sans-serif; color: #4A4A4A; }
  .demo-foot-in { max-width: 1440px; margin: 0 auto; padding: 32px 20px 48px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
  .demo-social a { width: 44px; height: 44px; border-radius: 6px; background: #5F5F5F; color: #fff; display: flex; align-items: center; justify-content: center; }
  .demo-rule { width: 100%; display: flex; align-items: center; gap: 32px; }
  .demo-rule::before, .demo-rule::after { content: ''; flex: 1 1 0; height: 1px; background: #1F1F1F; }
  .demo-rule img { height: 52px; width: auto; display: block; }
  .demo-legal { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 36px; font-size: 18px; }
  .demo-legal a { color: #4A4A4A; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
  @media (max-width: 520px) {
    .demo-head-in { padding: 12px 16px; gap: 8px; }
    .demo-head img { height: 38px; }
    .demo-nav { gap: 6px; }
    .demo-site { padding: 0 10px; }
    .demo-site span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .demo-rule { gap: 18px; }
    .demo-rule img { height: 40px; }
    .demo-legal { font-size: 16px; gap: 0 22px; }
  }
</style>
</head>
<body>
<header class="demo-head">
  <div class="demo-head-in">
    <a href="https://bravalua.de/" aria-label="Bravalua: zur Startseite"><img src="assets/logo-bravalua.webp" alt="Bravalua" width="1600" height="545"></a>
    <nav class="demo-nav" aria-label="Navigation">
      <a class="demo-site" href="https://bravalua.de/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>
        <span data-bv-i18n data-de="Zur Website" data-en="Website" data-pt="Ir para o site">Zur Website</span>
      </a>
      <div data-bv-langs></div>
    </nav>
  </div>
</header>

<main>
  <!-- Block 1: Store Finder -->
  <div data-bv-store-finder></div>
  <!-- Block 2: products -->
  <div data-bv-products></div>
</main>

<footer class="demo-foot">
  <div class="demo-foot-in">
    <div class="demo-social">
      <a href="https://www.instagram.com/bravalua.de/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
      </a>
    </div>
    <div class="demo-rule"><img src="assets/logo-bravalua.webp" alt="Bravalua" width="1600" height="545" loading="lazy"></div>
    <nav class="demo-legal" aria-label="Rechtliches">
      <a href="https://bravalua.de/datenschutzerklaerung/" target="_blank" rel="noopener noreferrer">Datenschutzerklärung</a>
      <a href="https://bravalua.de/impressum/" target="_blank" rel="noopener noreferrer">Impressum</a>
      <a href="https://bravalua.de/kontakt/" target="_blank" rel="noopener noreferrer">Kontakt</a>
    </nav>
  </div>
</footer>

<script src="config.js?v=202610152002"></script>
<script src="src/bv-data.js?v=202610152002"></script>
<script src="src/bv-store-finder.js?v=202610152002"></script>
</body>
</html>
